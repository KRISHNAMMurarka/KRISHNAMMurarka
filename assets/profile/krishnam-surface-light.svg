  <text x="40" y="42" fill="#116329" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2.2">WHERE I WORK</text>
  <text x="40" y="68" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="730" letter-spacing="-0.3">Engineering surface</text>
