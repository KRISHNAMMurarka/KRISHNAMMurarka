  <title id="kms-l-t">Krishnam Murarka's engineering surface and stack</title>
  <desc id="kms-l-d">Engineering surface across six areas. Product and SaaS builds with TypeScript and React. AI workflows using agents and RAG with Python and Node.js. Cloud and platform on AWS, Azure and Docker. Identity and security with OAuth, SSO and MFA. Data and enterprise pipelines and ERP, CRM and HRMS systems with MongoDB and JavaScript. Shipping with CI/CD and Kubernetes.</desc>
