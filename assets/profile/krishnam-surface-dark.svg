<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-labelledby="kms-d-t kms-d-d">
  <title id="kms-d-t">Krishnam Murarka's engineering surface</title>
  <desc id="kms-d-d">Six areas of engineering work: product and SaaS builds, AI workflows with agents and RAG, cloud and DevOps on Azure, identity and security including OAuth, SSO, MFA and post-quantum readiness, data pipelines and enterprise ERP, CRM and HRMS systems, all built with Python, Node.js and JavaScript.</desc>
