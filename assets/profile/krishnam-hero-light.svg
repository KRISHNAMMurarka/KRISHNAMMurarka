<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" role="img" aria-labelledby="kmHeroLightTitle kmHeroLightDesc">
  <title id="kmHeroLightTitle">Krishnam Murarka profile banner</title>
  <desc id="kmHeroLightDesc">A minimal systems diagram beside Krishnam Murarka's name and founder profile.</desc>
  <defs>
    <linearGradient id="kmHeroLightSurface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F4F7FA"/>
    </linearGradient>
    <linearGradient id="kmHeroLightAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F9F75"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <pattern id="kmHeroLightGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#DCE3EA" stroke-width="1" opacity="0.6"/>
    </pattern>
  </defs>

  <rect x="1" y="1" width="1278" height="418" rx="30" fill="url(#kmHeroLightSurface)" stroke="#CFD8E3" stroke-width="2"/>
  <rect x="2" y="2" width="1276" height="416" rx="29" fill="url(#kmHeroLightGrid)" opacity="0.58"/>
  <path d="M68 63H204" stroke="url(#kmHeroLightAccent)" stroke-width="4" stroke-linecap="round"/>

  <text x="68" y="96" fill="#536171" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="700" letter-spacing="3">EDILEC / FOUNDER PROFILE</text>
  <text x="68" y="184" fill="#0F172A" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="68" font-weight="750" letter-spacing="-2.4">KRISHNAM MURARKA</text>
  <text x="70" y="234" fill="#435063" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="500">Building software, AI, cloud, identity</text>
  <text x="70" y="270" fill="#435063" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="500">and developer systems.</text>

  <g fill="#536171" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="700" letter-spacing="2">
    <text x="70" y="354">FOUNDER</text>
    <text x="190" y="354">BUILDER</text>
    <text x="300" y="354">TECHNICAL AUTHOR</text>
  </g>
  <g fill="#0F9F75">
    <circle cx="54" cy="349" r="4"/>
    <circle cx="174" cy="349" r="4"/>
    <circle cx="284" cy="349" r="4"/>
  </g>

  <g transform="translate(874 52)">
    <rect x="0" y="0" width="330" height="316" rx="26" fill="#FFFFFF" fill-opacity="0.78" stroke="#C8D2DE" stroke-width="2"/>
    <circle cx="165" cy="158" r="105" fill="none" stroke="#C8D2DE" stroke-width="1.5" stroke-dasharray="5 10"/>
    <path d="M92 105L165 65L238 105V211L165 251L92 211Z" fill="none" stroke="#758397" stroke-width="2"/>
    <path d="M92 105L165 158L238 105M165 158V251M92 211L165 158L238 211" fill="none" stroke="#A9B5C2" stroke-width="2"/>
    <circle cx="165" cy="158" r="28" fill="url(#kmHeroLightAccent)"/>
    <circle cx="92" cy="105" r="11" fill="#FFFFFF" stroke="#0F9F75" stroke-width="4"/>
    <circle cx="238" cy="105" r="11" fill="#FFFFFF" stroke="#2563EB" stroke-width="4"/>
    <circle cx="92" cy="211" r="11" fill="#FFFFFF" stroke="#758397" stroke-width="4"/>
    <circle cx="238" cy="211" r="11" fill="#FFFFFF" stroke="#758397" stroke-width="4"/>
    <circle cx="165" cy="65" r="11" fill="#FFFFFF" stroke="#0F9F75" stroke-width="4"/>
    <circle cx="165" cy="251" r="11" fill="#FFFFFF" stroke="#2563EB" stroke-width="4"/>
    <g fill="#536171" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1.5">
      <text x="22" y="33">PRODUCT</text>
      <text x="222" y="33">SYSTEMS</text>
      <text x="22" y="292">OPERATIONS</text>
      <text x="238" y="292">EVIDENCE</text>
