    <circle cx="174" cy="349" r="4"/>
    <circle cx="284" cy="349" r="4"/>
  </g>

  <g transform="translate(874 52)">
    <rect x="0" y="0" width="330" height="316" rx="26" fill="#101720" fill-opacity="0.86" stroke="#334155" stroke-width="2"/>
    <circle cx="165" cy="158" r="105" fill="none" stroke="#3A4758" stroke-width="1.5" stroke-dasharray="5 10"/>
    <path d="M92 105L165 65L238 105V211L165 251L92 211Z" fill="none" stroke="#8291A5" stroke-width="2"/>
    <path d="M92 105L165 158L238 105M165 158V251M92 211L165 158L238 211" fill="none" stroke="#475569" stroke-width="2"/>
    <circle cx="165" cy="158" r="28" fill="url(#kmHeroDarkAccent)"/>
    <circle cx="92" cy="105" r="11" fill="#101720" stroke="#34D399" stroke-width="4"/>
    <circle cx="238" cy="105" r="11" fill="#101720" stroke="#60A5FA" stroke-width="4"/>
    <circle cx="92" cy="211" r="11" fill="#101720" stroke="#8291A5" stroke-width="4"/>
    <circle cx="238" cy="211" r="11" fill="#101720" stroke="#8291A5" stroke-width="4"/>
    <circle cx="165" cy="65" r="11" fill="#101720" stroke="#34D399" stroke-width="4"/>
    <circle cx="165" cy="251" r="11" fill="#101720" stroke="#60A5FA" stroke-width="4"/>
    <g fill="#9AA8B9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1.5">
      <text x="22" y="33">PRODUCT</text>
      <text x="222" y="33">SYSTEMS</text>
      <text x="22" y="292">OPERATIONS</text>
