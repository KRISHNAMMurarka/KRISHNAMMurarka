  <text x="376" y="229" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.4">DATA &amp; ENTERPRISE</text>
