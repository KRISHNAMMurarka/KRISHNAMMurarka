<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" role="img" aria-labelledby="kmHeroDarkTitle kmHeroDarkDesc">
  <title id="kmHeroDarkTitle">Krishnam Murarka profile banner</title>
  <desc id="kmHeroDarkDesc">A minimal systems diagram beside Krishnam Murarka's name and founder profile.</desc>
  <defs>
    <linearGradient id="kmHeroDarkSurface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111720"/>
      <stop offset="1" stop-color="#090D12"/>
    </linearGradient>
    <linearGradient id="kmHeroDarkAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <pattern id="kmHeroDarkGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#273242" stroke-width="1" opacity="0.58"/>
    </pattern>
  </defs>

  <rect x="1" y="1" width="1278" height="418" rx="30" fill="url(#kmHeroDarkSurface)" stroke="#2B3746" stroke-width="2"/>
  <rect x="2" y="2" width="1276" height="416" rx="29" fill="url(#kmHeroDarkGrid)" opacity="0.72"/>
  <path d="M68 63H204" stroke="url(#kmHeroDarkAccent)" stroke-width="4" stroke-linecap="round"/>

  <text x="68" y="96" fill="#9AA8B9" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="700" letter-spacing="3">EDILEC / FOUNDER PROFILE</text>
  <text x="68" y="184" fill="#F8FAFC" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="68" font-weight="750" letter-spacing="-2.4">KRISHNAM MURARKA</text>
  <text x="70" y="234" fill="#B8C3D1" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="500">Building software, AI, cloud, identity</text>
  <text x="70" y="270" fill="#B8C3D1" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="500">and developer systems.</text>

  <g fill="#AAB6C5" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="700" letter-spacing="2">
